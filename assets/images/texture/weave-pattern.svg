<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <pattern id="plainWeave" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Warp & Weft intersecting threads pattern -->
      <rect width="20" height="20" fill="none" />
      <path d="M 0 5 L 20 5 M 0 15 L 20 15" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>
      <path d="M 5 0 L 5 20 M 15 0 L 15 20" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>
      <circle cx="5" cy="5" r="1.5" fill="currentColor" fill-opacity="0.18" />
      <circle cx="15" cy="15" r="1.5" fill="currentColor" fill-opacity="0.18" />
      <circle cx="15" cy="5" r="1" fill="currentColor" fill-opacity="0.08" />
      <circle cx="5" cy="15" r="1" fill="currentColor" fill-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#plainWeave)" />
</svg>
