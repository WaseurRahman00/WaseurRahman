<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <pattern id="herringboneTwill" width="30" height="30" patternUnits="userSpaceOnUse">
      <!-- Herringbone twill weave simulation -->
      <path d="M 0 0 L 15 15 L 0 30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.10" stroke-linecap="round"/>
      <path d="M 15 0 L 30 15 L 15 30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.10" stroke-linecap="round"/>
      <path d="M 0 15 L 15 30" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.06"/>
      <path d="M 15 15 L 30 30" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#herringboneTwill)" />
</svg>
